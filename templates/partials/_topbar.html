<header id="topbar" class="topbar">
  <div class="topbar-inner">
    <div class="topbar-left">
      <button class="topbar-btn" id="sidebar-toggle-btn" type="button" title="Toggle sidebar">☰</button>
      <div>
        <div class="page-title" id="page-title">SUMS</div>
        <div class="breadcrumb" id="breadcrumb">SUMS</div>
      </div>
    </div>
    <div class="topbar-right">
      <button class="topbar-btn" id="notif-btn" type="button" title="Notices">
        🔔
        <span class="topbar-badge hidden" id="notif-badge">0</span>
      </button>
      <div class="dropdown" id="avatar-dropdown">
        <button class="topbar-avatar" id="topbar-avatar-btn" type="button" title="Account">?</button>
        <div class="dropdown-menu hidden" id="avatar-menu">
          <div class="dropdown-item dropdown-item-profile">
            <strong class="dropdown-profile-name" id="dropdown-profile-name">User</strong>
            <span class="dropdown-profile-email" id="dropdown-profile-email"></span>
          </div>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item danger" id="topbar-logout" type="button">🚪 Logout</button>
        </div>
      </div>
    </div>
  </div>
</header>
