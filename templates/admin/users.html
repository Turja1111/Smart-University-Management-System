{% extends "base.html" %}

{% block title %}Manage Users — SUMS{% endblock %}

{% block content %}
  <div class="section-header mb-6">
    <div>
      <div class="section-title">👥 Manage Users</div>
      <div class="section-subtitle">Add, edit, or delete user accounts securely.</div>
    </div>
    <div class="flex gap-3">
      <button id="btn-add-user" class="btn btn-primary">➕ Add User</button>
    </div>
  </div>

  <div class="glass-card mb-5">
    <div class="glass-card-inner flex gap-3" style="align-items:center;">
      <div class="form-control-icon flex-1" style="max-width: 400px;">
        <span class="input-icon">🔍</span>
        <input type="text" id="search-users" class="form-control" placeholder="Search by name or email..." />
      </div>
      <select id="filter-role" class="form-control" style="width: auto;">
        <option value="">All Roles</option>
        <option value="student">Student</option>
        <option value="teacher">Teacher</option>
        <option value="admin">Admin</option>
      </select>
    </div>
  </div>

  <div class="glass-card">
    <div class="glass-card-inner">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Joined</th>
              <th style="text-align: right;">Actions</th>
            </tr>
          </thead>
          <tbody id="admin-users-tbody">
            <tr><td colspan="5" class="table-empty">Loading users…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
{% endblock %}
