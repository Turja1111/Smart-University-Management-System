{% extends "base.html" %}

{% block title %}Courses — SUMS{% endblock %}

{% block content %}
  <div class="section-header mb-6">
    <div>
      <div class="section-title">📚 Courses</div>
      <div class="section-subtitle">Browse and enroll or manage</div>
    </div>
  </div>

  <div class="glass-card">
    <div class="glass-card-inner">
      <div class="table-wrapper">
        <table>
          <thead><tr><th>Code</th><th>Name</th><th>Teacher</th><th>Credits</th><th>Schedule</th></tr></thead>
          <tbody id="courses-tbody"><tr><td colspan="5" class="table-empty">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
{% endblock %}
