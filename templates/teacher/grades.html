{% extends "base.html" %}
{% load static %}

{% block title %}Teacher Grades — SUMS{% endblock %}

{% block content %}
  <div class="section-header mb-6">
    <div>
      <div class="section-title">📝 Grade Submissions</div>
      <div class="section-subtitle">Review and grade assignment submissions</div>
    </div>
  </div>

  <div class="glass-card">
    <div class="glass-card-inner">
      <div class="form-group">
        <label class="form-label" for="tg-course">Course Filter</label>
        <select class="form-control" id="tg-course"></select>
      </div>

      <div class="table-wrapper mt-4">
        <table>
          <thead>
            <tr>
              <th>Student</th>
              <th>Assignment</th>
              <th>Submitted</th>
              <th>Marks</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="tg-tbody">
            <tr><td colspan="6" class="table-empty">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
{% endblock %}
