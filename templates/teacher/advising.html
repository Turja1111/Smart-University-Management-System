{% extends 'base.html' %}
{% block content %}
<div class="page-header">
  <h2>Advising Approvals</h2>
  <p>Approve student advising submissions for your classes.</p>
</div>

<div class="card">
  <div class="card-body">
    <table class="table table-striped" id="advising-table">
      <thead>
        <tr>
          <th>Student</th>
          <th>Semester</th>
          <th>Year</th>
          <th>Courses Snapshot</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="advising-tbody">
        <tr><td colspan="6" class="table-empty">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Simple Modal for Schedule -->
<div id="schedule-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; align-items:center; justify-content:center;">
  <div class="glass-card" style="width:90%; max-width:600px; max-height:80vh; overflow-y:auto; position:relative;">
    <button id="close-modal-btn" style="position:absolute; top:16px; right:16px; background:none; border:none; font-size:1.5rem; cursor:pointer;">&times;</button>
    <div class="section-title mb-4">Student Schedule</div>
    <div id="schedule-modal-content">Loading...</div>
  </div>
</div>

{% endblock %}
