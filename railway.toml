[build]
builder = "railpack"
buildCommand = "pip install -r requirements.txt && python manage.py collectstatic --no-input"

[deploy]
preDeployCommand = "python manage.py migrate --no-input && python manage.py load_routine --path routine_extracted.json --semester fall --year 2026"
startCommand = "python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
