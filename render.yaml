databases:
  - name: sums-db
    plan: free
    databaseName: sums
    user: sums

services:
  - type: web
    name: smart-university-management-system
    runtime: python
    plan: free

    autoDeploy: true

    buildCommand: bash build.sh
    startCommand: python manage.py migrate --no-input && python manage.py load_routine --path routine_extracted.json --semester fall --year 2026 && python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sums-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production

      - key: PYTHON_VERSION
        value: "3.12.4"

      - key: WEB_CONCURRENCY
        value: "2"
